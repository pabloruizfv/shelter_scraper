name: Availability monitor

on:
  workflow_dispatch:
  schedule:
    # Madrid summer time, CEST = UTC+2
    # 00:00-01:59 Madrid: every 30 min -> 22:00-23:59 UTC
    - cron: "*/30 22-23 * * *"
    # 02:00-05:59 Madrid: every 1 h -> 00:00-03:59 UTC
    - cron: "0 0-3 * * *"
    # 06:00-07:59 Madrid: every 30 min -> 04:00-05:59 UTC
    - cron: "*/30 4-5 * * *"
    # 08:00-16:59 Madrid: every 15 min -> 06:00-14:59 UTC
    - cron: "*/15 6-14 * * *"
    # 17:00-21:59 Madrid: every 10 min -> 15:00-19:59 UTC
    - cron: "*/10 15-19 * * *"
    # 22:00-23:59 Madrid: every 15 min -> 20:00-21:59 UTC
    - cron: "*/15 20-21 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: availability-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TRACKED_DATES: ${{ vars.TRACKED_DATES || vars.TARGET_DATES }}
          ALERT_DATES: ${{ vars.ALERT_DATES }}
          NOTIFY_PROVIDER: ${{ vars.NOTIFY_PROVIDER || 'ntfy' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DB_PATH: data/availability.sqlite
          LOG_LEVEL: INFO
        run: python monitor.py --config config.example.yaml

      - name: Commit updated history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Respomuso availability history"
          file_pattern: data/availability.sqlite
