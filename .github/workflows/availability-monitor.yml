name: Check Respomuso availability

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check availability
        run: python monitor.py
        env:
          TRACKED_DATES: ${{ vars.TRACKED_DATES }}
          ALERT_DATES: ${{ vars.ALERT_DATES }}
          NOTIFY_PROVIDER: ${{ vars.NOTIFY_PROVIDER }}
          DB_PATH: data/availability.sqlite
          REQUEST_TIMEOUT: 20
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit updated database
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/availability.sqlite
          git diff --cached --quiet || git commit -m "Update availability database"
          git push
